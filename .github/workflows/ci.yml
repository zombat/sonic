name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, race tests, fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          sudo aa-complain /usr/bin/tshark /usr/bin/dumpcap /etc/apparmor.d/*tshark* /etc/apparmor.d/*wireshark* /etc/apparmor.d/*tcpdump* 2>/dev/null || true
          sudo apparmor_parser -R /etc/apparmor.d/*tshark* /etc/apparmor.d/*wireshark* /etc/apparmor.d/*tcpdump* 2>/dev/null || true
          chmod a+rx "$HOME" "$GITHUB_WORKSPACE" 2>/dev/null || true
          tshark --version | head -1

      - name: Check formatting, vet, and cross-platform builds
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=linux   GOARCH=arm64 go vet ./...
          GOOS=darwin  GOARCH=amd64 go vet ./...
          GOOS=darwin  GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...

      - name: Run Go race and coverage suite
        run: make test

      - name: Run fuzz smoke tests
        run: make fuzz

      - name: Build binaries and cross-platform release archives
        run: |
          make build release
          ls -lh build/release/
          ./build/sonic --version
          ./build/sonic-mcp --version
          (cd build/release && sha256sum -c SHA256SUMS)
