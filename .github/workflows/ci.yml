name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install tshark (the capture backend the tests exercise)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        # Real captures and proto files are not in the repo, so their tests skip here.
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # Continues on error until the existing code passes black and flake8.
    # Remove continue-on-error to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      - name: black (format check)
        run: python -m black --check *.py analyzers ai extractors handlers models utils tests/*.py
      - name: flake8
        run: python -m flake8 --count --statistics .

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Regenerate every fixture
        run: |
          for g in tests/fixtures/generate_*.py; do
            echo "== $g"
            python "$g"
          done
      - name: Fail if any fixture changed or appeared
        run: |
          changes=$(git status --porcelain --untracked-files=all tests/fixtures)
          if [ -n "$changes" ]; then
            echo "Fixtures are not reproducible. Changed or new files:"
            echo "$changes"
            git --no-pager diff --stat -- tests/fixtures || true
            exit 1
          fi
          echo "All fixtures regenerate byte-identically."

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  go:
    name: Go (build, vet, race tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - name: Check formatting, vet, and cross-platform builds
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=darwin GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build CLI, MCP, and release binaries
        run: make build release && ls -lh build/release/SHA256SUMS
      - name: Run Go race and coverage suite
        run: GOMAXPROCS=4 GOMEMLIMIT=2400MiB go test -race -p 1 -count=1 -cover ./...
