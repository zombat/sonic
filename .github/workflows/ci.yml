name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, race tests, fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - name: Check formatting, vet, and cross-platform builds
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=linux   GOARCH=arm64 go vet ./...
          GOOS=darwin  GOARCH=amd64 go vet ./...
          GOOS=darwin  GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...

      - name: Run Go race and coverage suite
        run: make test

      - name: Run fuzz smoke tests
        run: make fuzz

      - name: Build binaries and cross-platform release archives
        run: make build release && ls -lh build/release/
