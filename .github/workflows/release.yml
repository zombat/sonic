name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag override for manual runs"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1

      - name: Run Go quality gate
        run: |
          test -z "$(gofmt -l .)"
          make vet test fuzz

      - name: Cross-compile release archives and SHA256SUMS
        run: |
          REL_VERSION="${{ inputs.tag || github.ref_name }}"
          make release VERSION="$REL_VERSION"
          ls -lh build/release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
