name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag override for manual runs"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install tshark
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          sudo aa-complain /usr/bin/tshark /usr/bin/dumpcap /etc/apparmor.d/*tshark* /etc/apparmor.d/*wireshark* /etc/apparmor.d/*tcpdump* 2>/dev/null || true
          sudo apparmor_parser -R /etc/apparmor.d/*tshark* /etc/apparmor.d/*wireshark* /etc/apparmor.d/*tcpdump* 2>/dev/null || true
          chmod a+rx "$HOME" "$GITHUB_WORKSPACE" 2>/dev/null || true
          tshark --version | head -1

      - name: Run Go quality gate
        run: |
          test -z "$(gofmt -l .)"
          make vet test fuzz

      - name: Cross-compile release archives and SHA256SUMS
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          REL_VERSION="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s\n' "$REL_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "error: invalid release tag '$REL_VERSION'" >&2
            exit 1
          fi
          make release VERSION="$REL_VERSION"
          ls -lh build/release/
          (cd build/release && sha256sum -c SHA256SUMS)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
